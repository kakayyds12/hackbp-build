name: build-hack-bp
on: [push, workflow_dispatch]

env:
  BRANCH: oneplus/sm8350_u_14.0.0_oneplus9rt
  LV: -qgki-gac311b3399ae
  K: /tmp/kernel
  O: /tmp/kernel/out

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: 装依赖
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev \
                              build-essential git curl python3 rsync lld \
                              gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: 取 clang
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            /tmp/clang
          echo "===== clang 顶层目录 ====="
          ls /tmp/clang/
          echo "===== 找 clang ====="
          find /tmp/clang -maxdepth 3 -name clang -type f | head -5
          echo "===== 找 ld.lld ====="
          find /tmp/clang -maxdepth 4 -name 'ld.lld' -type f | head -5
          echo "===== 系统 lld ====="
          which ld.lld || true
          ls -l /usr/bin/ld.lld* 2>/dev/null || true

      - name: 拉内核源码
        run: |
          git clone --depth=1 --branch "$BRANCH" \
            https://github.com/OnePlusOSS/android_kernel_oneplus_sm8350.git "$K"
          cd "$K" && git log -1 --oneline

      - name: 配置内核
        run: |
          cd "$K"
          mkdir -p "$O"
          CFG=arch/arm64/configs/vendor/lahaina_QGKI.config
          echo ">>> 使用 $CFG (行数 $(wc -l < $CFG))"

          cp "$CFG" "$O/.config"

          ./scripts/config --file "$O/.config" --set-str LOCALVERSION "-qgki-gac311b3399ae"
          ./scripts/config --file "$O/.config" -d LOCALVERSION_AUTO
          ./scripts/config --file "$O/.config" -e MODULES
          ./scripts/config --file "$O/.config" -e MODVERSIONS

          # olddefconfig 不编译代码，用 gcc 交叉链跑更省事
          make O="$O" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          echo ">>> 关键配置:"
          grep -E '^CONFIG_LOCALVERSION|^CONFIG_MODULES=|^CONFIG_MODVERSIONS|^CONFIG_MODULE_SIG' "$O/.config"

      - name: 编 modules
        run: |
          cd "$K"
          make O="$O" ARCH=arm64 \
               CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
               OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
               CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
               LOCALVERSION=$LV modules -j$(nproc)

          echo ">>> kernelrelease:"
          make O="$O" ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
               LOCALVERSION=$LV kernelrelease

      - name: 编 hack_bp.ko
        run: |
          make -C "$GITHUB_WORKSPACE/ONEPLUS" KDIR="$K" LOCALVERSION=${{ env.LV }}

      - name: 打印信息
        run: |
          modinfo ONEPLUS/hack_bp.ko | grep -E 'vermagic|depends|name'

      - uses: actions/upload-artifact@v4
        with:
          name: hack_bp-ko
          path: ONEPLUS/hack_bp.ko
